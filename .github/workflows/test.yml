name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check editors.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('editors.json','utf8'))"
      - name: Check scripts parse
        run: node --check umax.js && node --check app.js
      - name: Run test suite
        run: node test.js
